fill-opacity = 1
text-anchor = middle
filter = url(#dropshadow)

[webgl_viewopts]
voxlines = false
voxline_color = #FFFFFF
voxline_width = 0.01
# How uniform (flat, shadowless) the illumination is, from 0 (fully directional
# lighting) to 1 (emissive only, no diffuse or specular). Booleans are still
# accepted for backwards compatibility. This is the value unfolding starts from:
# unfolding towards a flatmap drives illumination to fully uniform on its own,
# unless bumpy_flatmap is on.
uniform_illumination = 0
# Crossfade from the default headlight (0) to a single light from the upper
# left (1), following the top-left lighting convention used for shaded-relief
# topographic maps. Makes sulci read as valleys and gyri as ridges, which helps
# when bumpy_flatmap is enabled. Booleans are still accepted for backwards
# compatibility. Dimmer overall than the default lighting. This is the value
# unfolding starts from: unfolding a bumpy flatmap towards flat drives top-left
# lighting to 1 on its own.
topleft_lighting = 0
# Specular reflection level. This is the value unfolding starts from: it is
# driven to zero along with the illumination as the surface flattens, unless
# bumpy_flatmap is on.
specularity = 1.0
overlayscale = 1
anim_speed = 2
bumpy_flatmap = false
# How much to exaggerate the relief of a bumpy flatmap. 1.0 is the computed
# geometry at its true scale; larger values make the gyri and sulci easier to
# read at the cost of no longer being to scale. The default exaggerates a
# little, because a 2-5 mm slab is subtle next to a whole flatmap and the
# relief is there to be read. Purely a display setting -- it does not change
# the cached geometry, so it can be adjusted freely. This is where the viewer's
# bumpy_flatmap_scale slider starts; the slider runs to five times true scale,
# or to twice this value if that is higher.
bumpy_flatmap_scale = 1.55
allow_tilt = false

[curvature]
contrast = 0.25
brightness = 0.5
# Defines smoothing kernel for computation of vertex-wise curvature; None is default
smooth = None
# Use / don't use thresholded curvature for quickflat.
threshold = True
# Determines how smooth / thresholded pre-computed curvature is in webgl display; 0 is thresholded, 1 is totally smooth
webgl_smooth = 0.0

[webgl]
layers = rois,
# When creating webgl viewers, this domain name will be appended to your computer name. Default is blank (no extra domain name)
domain_name = 
[webshow]
autoclose = true
open_browser = true
