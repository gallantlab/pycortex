[basic]
default_cmap = RdBu_r
default_cmap2D = PU_BuOr_covar
# Change fsl_prefix to fsl5.0- only if FSL was installed with 
# NeuroDebian and you don't want to source /etc/fsl/fsl.sh every time.
fsl_prefix = 

[dependency_paths]
# The following specify paths to the binary executable files
# for external dependencies of pycortex. The default values 
# (just "inkscape" and "blender") should work on Linux,
# since the binaries should already be on the system path if 
# blender and inkscape are installed.
# For MacOS, unless you have done some manual configuration on
# your own, these will need to be something like:
# blender = /Applications/Blender/blender.app/Contents/MacOS/blender
# inkscape = /Applications/Inkscape.app/Contents/MacOS/Inkscape
# On Windows, where inkscape is usually not on the PATH environment
# variable, give the full path to the executable, for example:
# inkscape = C:\Program Files\Inkscape\bin\inkscape.exe
# The inkscape value may either be a full path to the executable, which
# is then used as given, or the name "inkscape", in which case pycortex
# uses whatever inkscape is on the PATH environment variable. A path that
# does not point at an existing file also falls back on the PATH.
inkscape = inkscape
blender = blender
# SLIM and meshlab are optional dependencies  for pycortex, that 
# provide a fast-and-dirty alternative to flattening brains with
# freesurfer (SLIM), and an alternative way to visualize 
# intermediate stages of cortical mesh & flatmap generation (meshlab)
# Download SLIM code here: https://github.com/MichaelRabinovich/Scalable-Locally-Injective-Mappings
# Download meshlab here: http://www.meshlab.net/
slim = None
meshlab = None

[mayavi_aligner]
line_width = 1
point_size = 2
outline_color = white
outline_rep = wireframe
opacity = 0
colormap = gray

[paths_default]
stroke = white
fill = none
display = inline
filter = url(#dropshadow)
stroke-width = 3
stroke-opacity = 1
fill-opacity = 0
stroke-dashoffset = None
stroke-dasharray = None

[labels_default]
font-family = Helvetica, sans-serif
font-size = 18pt
font-weight = bold
font-style = italic
fill = white
fill-opacity = 1
text-anchor = middle
filter = url(#dropshadow)

[overlay_paths]
stroke = white
fill = none
display = inline
filter = url(#dropshadow)
stroke-width = 2
stroke-opacity = 1
fill-opacity = 0
stroke-dashoffset = None
stroke-dasharray = None

[overlay_text]
font-family = Helvetica, sans-serif
font-size = 14pt
font-weight = bold
font-style = italic
fill = white
fill-opacity = 1
text-anchor = middle
filter = url(#dropshadow)

[rois_paths]
stroke = white
fill = none
display = inline
filter = url(#dropshadow)
stroke-width = 2
stroke-opacity = 1
fill-opacity = 0
stroke-dashoffset = None
stroke-dasharray = None

[rois_labels]
font-family = Helvetica, sans-serif
font-size = 14pt
font-weight = bold
font-style = italic
fill = white
fill-opacity = 1
text-anchor = middle
filter = url(#dropshadow)

[sulci_paths]
